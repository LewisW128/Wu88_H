<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Business Card Hover Gradient Editor</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #f4f4f4;
  }
  .editor {
    display: flex;
    border-bottom: 1px solid #33334d;
  }
  .panel {
    padding: 28px 32px;
  }
  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 420px;
    flex-shrink: 0;
    border-right: 1px solid #33334d;
  }
  .preview-label { font-size: 13px; color: #a2a2a2; letter-spacing: 0.5px; }
  .card-wrap {
    position: relative;
    width: 346px;
    height: 130px;
    flex-shrink: 0;
  }
  .card-preview {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 25px;
    background: #f4f4f4;
    border: 2px solid #f4f4f4;
    overflow: hidden;
  }
  .card-dots {
    position: absolute;
    left: 50%;
    top: calc(50% + 93.5px);
    width: 378.536px;
    height: 361px;
    transform: translate(-50%, -50%);
    background-image: radial-gradient(circle, #dbdbdb 2.5px, transparent 2.5px);
    background-size: 22px 22px;
    opacity: 0.5;
    pointer-events: none;
  }
  .card-logo {
    position: absolute;
    left: 18px;
    top: 9px;
    width: 108px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: #444;
    letter-spacing: 1px;
  }
  .card-name {
    position: absolute;
    right: 18px;
    top: 47px;
    font-size: 20px;
    font-weight: 700;
    color: #021128;
    white-space: nowrap;
  }
  .card-ring {
    position: absolute;
    inset: 0;
    border-radius: 25px;
    border: 2px solid transparent;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0) border-box;
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .badge-preview { display: none; }
  .controls { flex: 1; min-width: 0; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .hint { color: #a2a2a2; font-size: 12px; margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .row label { width: 60px; font-size: 13px; color: #ccc; flex-shrink: 0; }
  input[type="range"] { flex: 1; }
  input[type="number"] { width: 64px; background: #26263f; border: 1px solid #3a3a5c; color: #fff; border-radius: 6px; padding: 4px 6px; }
  .stops { margin-top: 16px; }
  .stop-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: #22223a; padding: 8px 10px; border-radius: 8px; }
  .stop-row input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .stop-row input[type="range"] { flex: 1; }
  .stop-row .pos-val { width: 44px; font-size: 12px; text-align: right; color: #a2a2a2; }
  .stop-row button { background: #3e3e5e; border: none; color: #f88; border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; }
  .add-btn { margin-top: 8px; background: #23f3d5; color: #1a1a2e; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; font-size: 13px; }
  .output { margin-top: 20px; }
  .output label { font-size: 13px; color: #ccc; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%;
    background: #111122;
    color: #23f3d5;
    border: 1px solid #3a3a5c;
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    resize: vertical;
    min-height: 60px;
  }
  .copy-btn { margin-top: 6px; background: #444; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .copy-btn.copied { background: #23f3d5; color: #1a1a2e; }
  .corner-hint { display: flex; justify-content: space-between; width: 346px; font-size: 11px; color: #666; margin-top: -8px; }
</style>
</head>
<body>

<div class="editor" id="editor-card">
  <div class="panel preview-panel">
    <div class="preview-label">Business Card Hover 邊匡</div>
    <div class="card-wrap">
      <div class="card-preview">
        <div class="card-dots"></div>
        <div class="card-logo">CQ9</div>
        <div class="card-name">CQ9 GAMING</div>
      </div>
      <div class="card-ring" data-role="ringPreview"></div>
    </div>
    <div class="corner-hint"><span>左上 ↖</span><span>右下 ↘</span></div>
  </div>
  <div class="panel controls">
    <h1>卡片 Hover 邊匡漸層</h1>
    <div class="hint">拖動色標調整顏色/位置,拖動角度讓左上/右下對到你要的顏色,滿意後複製下方 CSS 貼給我。</div>
    <div class="row">
      <label>角度</label>
      <input type="range" data-role="angle" min="-180" max="180" value="132" />
      <input type="number" data-role="angleNum" min="-180" max="180" value="132" />
      <span>deg</span>
    </div>
    <div class="stops" data-role="stops"></div>
    <button class="add-btn" data-role="addStop">+ 新增色標</button>
    <div class="output">
      <label>CSS linear-gradient</label>
      <textarea data-role="cssOut" readonly></textarea>
      <button class="copy-btn" data-role="copyBtn">複製</button>
    </div>
  </div>
</div>

<script>
  function createEditor(root, initialStops, initialAngle, applyPreview) {
    let stops = initialStops.map(s => ({ ...s }));

    const angleEl = root.querySelector('[data-role="angle"]');
    const angleNumEl = root.querySelector('[data-role="angleNum"]');
    const stopsEl = root.querySelector('[data-role="stops"]');
    const cssOut = root.querySelector('[data-role="cssOut"]');
    const copyBtn = root.querySelector('[data-role="copyBtn"]');
    const addStopBtn = root.querySelector('[data-role="addStop"]');

    angleEl.value = initialAngle;
    angleNumEl.value = initialAngle;

    function buildGradientString() {
      const angle = angleEl.value;
      const sorted = [...stops].sort((a, b) => a.pos - b.pos);
      const stopStr = sorted.map(s => `${s.color} ${s.pos}%`).join(", ");
      return `linear-gradient(${angle}deg, ${stopStr})`;
    }

    function render() {
      const gradient = buildGradientString();
      applyPreview(gradient);
      cssOut.value = gradient;
      copyBtn.classList.remove("copied");
      copyBtn.textContent = "複製";
    }

    function renderStopRows() {
      stopsEl.innerHTML = "";
      stops.forEach((stop, i) => {
        const row = document.createElement("div");
        row.className = "stop-row";
        row.innerHTML = `
          <input type="color" value="${stop.color}" data-idx="${i}" class="colorInput" />
          <input type="range" min="0" max="100" value="${stop.pos}" data-idx="${i}" class="posInput" />
          <span class="pos-val">${stop.pos}%</span>
          <button data-idx="${i}" class="removeBtn">×</button>
        `;
        stopsEl.appendChild(row);
      });

      stopsEl.querySelectorAll(".colorInput").forEach(el => {
        el.addEventListener("input", e => {
          stops[+e.target.dataset.idx].color = e.target.value;
          render();
        });
      });
      stopsEl.querySelectorAll(".posInput").forEach(el => {
        el.addEventListener("input", e => {
          const idx = +e.target.dataset.idx;
          stops[idx].pos = +e.target.value;
          el.closest(".stop-row").querySelector(".pos-val").textContent = e.target.value + "%";
          render();
        });
      });
      stopsEl.querySelectorAll(".removeBtn").forEach(el => {
        el.addEventListener("click", e => {
          const idx = +e.target.dataset.idx;
          stops.splice(idx, 1);
          renderStopRows();
          render();
        });
      });
    }

    angleEl.addEventListener("input", () => { angleNumEl.value = angleEl.value; render(); });
    angleNumEl.addEventListener("input", () => { angleEl.value = angleNumEl.value; render(); });

    addStopBtn.addEventListener("click", () => {
      stops.push({ color: "#ffffff", pos: 50 });
      renderStopRows();
      render();
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(cssOut.value).then(() => {
        copyBtn.textContent = "已複製";
        copyBtn.classList.add("copied");
      });
    });

    renderStopRows();
    render();
  }

  const defaultStops = [
    { color: "#01fab0", pos: 0 },
    { color: "#14e8b8", pos: 0 },
    { color: "#48bace", pos: 11 },
    { color: "#9a71f1", pos: 34 },
    { color: "#b65afd", pos: 49 },
    { color: "#8d54d8", pos: 74 },
    { color: "#6f4fbd", pos: 87 },
    { color: "#644eb3", pos: 100 },
  ];

  createEditor(
    document.getElementById("editor-card"),
    defaultStops,
    132,
    (gradient) => {
      document.querySelector('#editor-card [data-role="ringPreview"]').style.background = gradient;
    }
  );
</script>

</body>
</html>
